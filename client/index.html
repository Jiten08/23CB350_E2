<!--
  =============================================================================
  index.html
  =============================================================================

  PURPOSE:
    The single real HTML page of this single-page app. React draws everything
    inside it.

  WHAT TO BUILD:
    Vite creates this file for you. Check that it has:
      - <html lang="en">, a UTF-8 charset and a mobile viewport meta tag
        (most victims will use a phone)
      - <title>AppName</title>
      - an empty <div id="root"></div>, where React mounts the app
      - <script type="module" src="/src/main.jsx"></script>

  TALKS TO:
    - src/main.jsx, which finds #root and renders <App /> into it

  STEPS:
    1. Create the Vite app (see README). Vite will overwrite this file.
    2. Change the <title> to "AppName".
    3. Make sure the script tag points to /src/main.jsx.

  CONCEPTS TO LEARN:
    - Single-page apps (SPA) vs multi-page websites
    - <script type="module">
    - The viewport meta tag, for mobile layouts
-->
